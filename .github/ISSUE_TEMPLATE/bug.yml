name: Bug report
description: Report reproducible incorrect behavior in a published package.
title: 'bug: '
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        [
          atelier,
          megapixels,
          pixel-motion,
          pixel-utils,
          pixels,
          uniform,
          veto,
          repository tooling,
        ]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '@fuf-stack/pixels 1.13.2'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal repository, Storybook link, or exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, Node, React, TypeScript, package manager, and relevant assistive technology.
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
