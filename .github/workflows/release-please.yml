name: release-please

on:
  push:
    branches:
      - main
      - next # prerelease branch

# Ensure only one release workflow runs at a time
# Queue new runs and wait for in-progress release-please workflow to complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for OIDC trusted publishing with npm
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}
          # Target the branch that triggered the workflow
          target-branch: ${{ github.ref_name }}
          # Use different config/manifest based on branch
          config-file: ${{ github.ref_name == 'next' && 'release-please-config-next.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'next' && '.release-please-manifest-next.json' || '.release-please-manifest.json' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
        if: steps.release.outputs.releases_created == 'true'

      - name: Setup project
        uses: ./.github/actions/setup-project
        if: steps.release.outputs.releases_created == 'true'

      - name: Verify publish artifacts
        run: pnpm verify:packages
        if: steps.release.outputs.releases_created == 'true'

      - name: Publish to npm
        shell: bash
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_PATHS: ${{ steps.release.outputs.paths_released }}
          DIST_TAG: ${{ github.ref_name == 'next' && 'next' || 'latest' }}
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # Pack only the released paths. pnpm resolves workspace:* in each tarball.
          paths=$(jq -er 'select(type == "array" and length > 0 and all(.[]; test("^packages/[a-z0-9-]+$"))) | .[]' <<< "$RELEASE_PATHS")
          artifacts=$(mktemp -d)
          filters=()
          for pkg in $paths; do
            jq -e '(.private != true) and (.version | type == "string" and length > 0 and . != "0.0.0")' "$pkg/package.json" >/dev/null
            filters+=(--filter "./$pkg")
          done
          # Publish dependencies before their dependents, so a released
          # package never points at a version that is not on npm yet.
          mapfile -t ordered < <(pnpm --recursive --workspace-concurrency=1 "${filters[@]}" exec pwd)
          if (( ${#ordered[@]} * 2 != ${#filters[@]} )); then
            echo "::error::pnpm ordered ${#ordered[@]} of $(( ${#filters[@]} / 2 )) packages"
            exit 1
          fi
          archives=()
          for pkg in "${ordered[@]}"; do
            archives+=("$(pnpm --dir "$pkg" pack --pack-destination "$artifacts" --json | jq -er .filename)")
          done

          # Keep publishing packages that do not depend on a failed one, then
          # fail the job. Trusted publishing only works for packages that
          # already exist on npm, so a new package needs one manual publish
          # before its first release.
          failed=()
          failed_names=()
          for archive in "${archives[@]}"; do
            manifest=$(tar -xOf "$archive" package/package.json)
            name=$(jq -r .name <<< "$manifest")
            spec="$name@$(jq -r .version <<< "$manifest")"
            # A retry can encounter versions already published by this run.
            if [[ "$(npm view "$spec" version 2>/dev/null || true)" == "${spec##*@}" ]]; then
              continue
            fi
            # A dependent would point at a version that is missing on npm.
            dependencies=$(jq -r '(.dependencies // {}) + (.peerDependencies // {}) | keys[]' <<< "$manifest")
            blocked=""
            for failed_name in "${failed_names[@]}"; do
              if grep -qxF "$failed_name" <<< "$dependencies"; then
                blocked=$failed_name
                break
              fi
            done
            if [[ -n "$blocked" ]]; then
              echo "::error::Skipping $spec because $blocked failed to publish"
            elif npm publish "$archive" --tag "$DIST_TAG" --access public; then
              continue
            fi
            failed+=("$spec")
            failed_names+=("$name")
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Failed to publish: ${failed[*]}"
            exit 1
          fi

  # update other conflicting prs after package merge
  # see: https://github.com/googleapis/release-please/issues/1870#issuecomment-1748390833
  # Only runs on main branch (not for prerelease branches)
  check-conflicting-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      repository-projects: read # needed for 'gh pr edit' https://github.com/cli/cli/issues/6274
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && github.ref_name == 'main'
    outputs:
      need_rebase: ${{ steps.check-pending-prs.outputs.need_rebase }}
    steps:
      - name: Get pending PRs
        id: check-pending-prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only main release PRs: the rebase job below refreshes main only, so
          # removing the label from a next release PR would silently skip its release.
          pending_prs=$(gh pr list --repo "$REPO" --base main --label "autorelease: pending" --state open --json number --jq '.[].number')
          need_rebase=""

          if [[ -n "$pending_prs" ]]; then
            for pr_num in $pending_prs; do
              echo "Checking pr: $pr_num"
              mergeable=$(gh pr view --repo "$REPO" "$pr_num" --json mergeable --jq '.mergeable')
              echo "mergeable status: $mergeable"
              if [[ "$mergeable" != "MERGEABLE" ]]; then
                echo "pr: $pr_num is not MERGEABLE."
                echo "removing 'autorelease: pending' label from pr: $pr_num"
                gh pr edit --repo "$REPO" "$pr_num" --remove-label "autorelease: pending"
                need_rebase=true
              fi
            done
          else
              echo "No pending PRs found."
              exit 0
          fi

          if [[ -n "$need_rebase" ]]; then
            echo "not MERGEABLE status PRs found."
            echo "need_rebase=$need_rebase"
            echo "need_rebase=$need_rebase" >> "$GITHUB_OUTPUT"
          else
            echo "All pending PRs are MERGEABLE."
          fi

  release-please-rebase:
    needs: check-conflicting-prs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: needs.check-conflicting-prs.outputs.need_rebase == 'true'
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
