# This workflow lets maintainers explicitly request snapshot autofixes on Renovate PRs.
# It tests updates and pushes external snapshot changes back to the Renovate branch.
# Untrusted build/test code and repository write credentials run on separate runners.
name: renovate-snapshot-autofix

on:
  # Request-driven mode on Renovate PRs. Keep rerunning after updates/reopens
  # while the opt-in label is present.
  pull_request_target:
    types: [labeled, synchronize, reopened]
  # Alternative request mode: comment `/autofix-snapshots` on a Renovate PR.
  issue_comment:
    types: [created]
  # Fallback manual trigger from Actions UI for a specific branch.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Renovate branch to update external snapshots for'
        required: true
        type: string

# Grant each job only the permissions needed for its part of the workflow.
permissions: {}

jobs:
  resolve:
    name: Resolve immutable Renovate head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed to resolve current PR metadata for label and comment requests.
      pull-requests: read
    # Run for an opted-in same-repository Renovate PR, an authorized comment,
    # or a manual request. Resolve the head once so later jobs test the same SHA.
    if: >-
      ${{
        (github.event_name == 'pull_request_target' &&
         contains(github.event.pull_request.labels.*.name, 'autofix:snapshots') &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'renovate/')) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         github.event.comment.body == '/autofix-snapshots' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        github.event_name == 'workflow_dispatch'
      }}
    outputs:
      branch: ${{ steps.head.outputs.branch }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Resolve requests using the trusted workflow revision, without Git auth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-snapshot-autofix.mjs`);
            const { resolveHead } = await import(scriptUrl.href);
            await resolveHead({ github, context, core });

  snapshots:
    name: Build and test without write credentials
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.payload.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the resolved PR/manual-request commit without retaining auth.
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Run tests and collect external snapshot updates
        id: payload
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-snapshot-autofix.mjs`);
            const { buildSnapshots } = await import(scriptUrl.href);
            buildSnapshots({ core });
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.payload.outputs.changed == 'true'
        with:
          name: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-output/snapshots.json
          if-no-files-found: error
          retention-days: 1

  write:
    name: Apply validated snapshot data
    needs: [resolve, snapshots]
    if: needs.snapshots.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed to create the snapshot commit and update the Renovate branch.
      contents: write
      # GITHUB_TOKEN-backed commits do not emit another pull_request event;
      # dispatch CI explicitly after the snapshot commit is accepted.
      actions: write
    steps:
      # Never check out the Renovate head or install its dependencies here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-input
      - name: Validate snapshots and create commit through GitHub API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_BRANCH: ${{ needs.resolve.outputs.branch }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-snapshot-autofix.mjs`);
            const { run } = await import(scriptUrl.href);
            await run({ github, context });
