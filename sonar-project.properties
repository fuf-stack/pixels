sonar.projectKey=fuf-stack_pixels
sonar.organization=fuf-stack

# set test files
sonar.test.inclusions=**/*.test.{ts,tsx}

# set coverage report path (created in CI)
# see: https://docs.sonarsource.com/sonarqube/9.9/analyzing-source-code/test-coverage/javascript-typescript-test-coverage/
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# exclude some files from coverage
# see: https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-scope/#code-coverage-exclusions
sonar.coverage.exclusions=\
  *.js,\
  *.ts,\
  **/*.test.*,\
  **/*.stories.*,\
  **/__mocks__/**/*,\
  scripts/**/*,\
  packages/*/*.js,\
  packages/*/*.ts,\
  packages/*/bin/**/*,\
  packages/*/scripts/**/*,\
  packages/*/test/**/*,\
  packages/config/**/*

# exclude files from duplications
# see: https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-scope/#duplication-exclusions
sonar.cpd.exclusions=\
  **/*.test.*,\
  **/*.stories.*,\
  packages/config/**/*

# =============================================================================
# ISSUE EXCLUSIONS
# =============================================================================
# see: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/
# Every exclusion needs a short comment explaining why it is safe. Register its
# key in this list (g* = global rule exclusions, f* = specific findings).
sonar.issue.ignore.multicriteria=g1,g2,g3,g4,g5,f1,f2

# -----------------------------------------------------------------------------
# Global rule exclusions: rules that don't fit a whole kind of file
# -----------------------------------------------------------------------------

# "add some tests to this file": S2187 can't see tests registered by helpers
# like storySnapshots(), and Vitest already fails test files without tests
sonar.issue.ignore.multicriteria.g1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.g1.resourceKey=**/*.test.*

# "empty method": test setup stubs browser APIs (e.g. ResizeObserver) for jsdom
sonar.issue.ignore.multicriteria.g2.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.g2.resourceKey=**/vitest.setup.ts

# "super-linear regex": codemods only run once on our own source, never at runtime
sonar.issue.ignore.multicriteria.g3.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.g3.resourceKey=packages/*/codemods/**/*

# "prefer top-level await": promise chains are fine in codemods and build scripts
sonar.issue.ignore.multicriteria.g4.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.g4.resourceKey=packages/*/codemods/**/*
sonar.issue.ignore.multicriteria.g5.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.g5.resourceKey=packages/*/scripts/**/*

# -----------------------------------------------------------------------------
# Specific findings: reviewed false positives or accepted risks in one file.
# Scope each entry to the single file (exclusions apply to the whole file, so
# re-review the entry whenever that file changes).
# -----------------------------------------------------------------------------

# S7631 "untrusted code from a fork": forks can't trigger it (same-repo
# renovate/* only, checked in `if:` and resolveHead). Branch code runs with a
# read-only token, no credentials, no secrets and read-only cache; the write
# job checks out workflow_sha and validates the artifact before writing
sonar.issue.ignore.multicriteria.f1.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.f1.resourceKey=.github/workflows/renovate-snapshot-autofix.yml

# S4036 "PATH contains writable directories": git/pnpm run on hosted runners in
# the read-only build job, which runs branch code on purpose anyway
sonar.issue.ignore.multicriteria.f2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.f2.resourceKey=scripts/ci-snapshot-autofix.mjs
